name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python checks and physics tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip "numpy>=1.26,<3"

      - name: Syntax check
        run: >
          python -m py_compile
          __init__.py algo.py bake.py gizmos.py handlers.py keyframes.py
          operators.py panels.py presets.py properties.py
          tools/build_addon.py tests/test_physics.py tests/blender_test.py

      - name: Physics tests (bpy-free)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build distribution zips
        run: python tools/build_addon.py

      - name: Upload distribution zips
        uses: actions/upload-artifact@v4
        with:
          name: addon-zips
          path: dist/*.zip
          if-no-files-found: error

  blender-tests:
    name: Blender 5.2 headless integration
    runs-on: ubuntu-latest
    env:
      BLENDER_VERSION: "5.2.2"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p blender
          curl -fL --retry 3 -o "$RUNNER_TEMP/blender.tar.xz" \
            "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C blender --strip-components=1
          rm -f "$RUNNER_TEMP/blender.tar.xz"

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libgl1 libegl1 libsm6 libice6 libxkbcommon0

      - name: Headless register/bake/unbake tests
        run: >
          ./blender/blender --background --factory-startup
          --python-exit-code 1 --python tests/blender_test.py

      - name: Build and validate extension manifest
        run: |
          python3 tools/build_addon.py
          ./blender/blender --command extension validate dist/*-extension.zip
